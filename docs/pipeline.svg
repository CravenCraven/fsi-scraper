<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13">
  <title>fsi-scraper pipeline</title>
  <desc>Five stages run top to bottom: discover, fetch, parse, load, export. Each stage produces one output shown to its right.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b6a65" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .stage { fill: #e1f5ee; stroke: #0f6e56; }
    .out   { fill: #f1efe8; stroke: #b4b2a9; }
    .t     { fill: #1d1d1b; font-weight: 600; }
    .s     { fill: #5f5e5a; font-size: 11.5px; }
    line   { stroke: #6b6a65; stroke-width: 1.2; }
  </style>
  <g>
    <rect class="stage" x="40" y="20" width="240" height="56" rx="6"/>
    <text class="t" x="160" y="44" text-anchor="middle">1. discover</text>
    <text class="s" x="160" y="63" text-anchor="middle">read the course page</text>
    <rect class="out" x="400" y="20" width="240" height="56" rx="6"/>
    <text class="t" x="520" y="44" text-anchor="middle">list of files</text>
    <text class="s" x="520" y="63" text-anchor="middle">36 for FAST: 34 mp3s, 2 PDFs</text>
    <line x1="280" y1="48" x2="392" y2="48" marker-end="url(#a)"/>
    <line x1="160" y1="76" x2="160" y2="94" marker-end="url(#a)"/>

    <rect class="stage" x="40" y="100" width="240" height="56" rx="6"/>
    <text class="t" x="160" y="124" text-anchor="middle">2. fetch</text>
    <text class="s" x="160" y="143" text-anchor="middle">download, resume, verify size</text>
    <rect class="out" x="400" y="100" width="240" height="56" rx="6"/>
    <text class="t" x="520" y="124" text-anchor="middle">files on disk</text>
    <text class="s" x="520" y="143" text-anchor="middle">data/raw/&lt;course&gt;/&lt;kind&gt;/</text>
    <line x1="280" y1="128" x2="392" y2="128" marker-end="url(#a)"/>
    <line x1="160" y1="156" x2="160" y2="174" marker-end="url(#a)"/>

    <rect class="stage" x="40" y="180" width="240" height="56" rx="6"/>
    <text class="t" x="160" y="204" text-anchor="middle">3. parse</text>
    <text class="s" x="160" y="223" text-anchor="middle">read the PDF text layer</text>
    <rect class="out" x="400" y="180" width="240" height="56" rx="6"/>
    <text class="t" x="520" y="204" text-anchor="middle">lessons and dialog lines</text>
    <text class="s" x="520" y="223" text-anchor="middle">FAST: 30 lessons, 351 lines</text>
    <line x1="280" y1="208" x2="392" y2="208" marker-end="url(#a)"/>
    <line x1="160" y1="236" x2="160" y2="254" marker-end="url(#a)"/>

    <rect class="stage" x="40" y="260" width="240" height="56" rx="6"/>
    <text class="t" x="160" y="284" text-anchor="middle">4. load</text>
    <text class="s" x="160" y="303" text-anchor="middle">upsert into Postgres, save hashes</text>
    <rect class="out" x="400" y="260" width="240" height="56" rx="6"/>
    <text class="t" x="520" y="284" text-anchor="middle">Postgres</text>
    <text class="s" x="520" y="303" text-anchor="middle">course, resource, lesson, dialog_line</text>
    <line x1="280" y1="288" x2="392" y2="288" marker-end="url(#a)"/>
    <line x1="160" y1="316" x2="160" y2="334" marker-end="url(#a)"/>

    <rect class="stage" x="40" y="340" width="240" height="56" rx="6"/>
    <text class="t" x="160" y="364" text-anchor="middle">5. export</text>
    <text class="s" x="160" y="383" text-anchor="middle">read a sample back out</text>
    <rect class="out" x="400" y="340" width="240" height="56" rx="6"/>
    <text class="t" x="520" y="364" text-anchor="middle">corpus-sample.json</text>
    <text class="s" x="520" y="383" text-anchor="middle">read by the homelab at build time</text>
    <line x1="280" y1="368" x2="392" y2="368" marker-end="url(#a)"/>
  </g>
  <text class="s" x="340" y="435" text-anchor="middle">Every stage can be run twice and leave the same result.</text>
</svg>
